name: meridian-issue-review-full
description: |
  Use when: User wants a FULL, COMPREHENSIVE fix + review pipeline for a GitHub issue.
  Triggers: "full review", "comprehensive fix", "fix with full review", "deep review", "issue review full".
  NOT for: Simple issue fixes (use meridian-fix-github-issue instead),
           questions about issues, CI failures, PR reviews, general exploration.

  Full workflow:
  1. Investigate issue -> root cause analysis, implementation plan
  2. Implement fix -> code changes, tests, PR creation
  3. Comprehensive review -> 5 parallel agents with scope awareness
  4. Fix review issues -> address CRITICAL/HIGH findings
  5. Final summary -> decision matrix, follow-up recommendations

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: INVESTIGATE
  # ═══════════════════════════════════════════════════════════════════

  - id: investigate
    command: meridian-investigate-issue

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════════

  - id: implement
    command: meridian-implement-issue
    depends_on: [investigate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [implement]

  - id: review-scope
    command: meridian-pr-review-scope
    depends_on: [verify-pr-base]
    context: fresh

  - id: sync
    command: meridian-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh

  - id: code-review
    command: meridian-code-review-agent
    depends_on: [sync]
    context: fresh

  - id: error-handling
    command: meridian-error-handling-agent
    depends_on: [sync]
    context: fresh

  - id: test-coverage
    command: meridian-test-coverage-agent
    depends_on: [sync]
    context: fresh

  - id: comment-quality
    command: meridian-comment-quality-agent
    depends_on: [sync]
    context: fresh

  - id: docs-impact
    command: meridian-docs-impact-agent
    depends_on: [sync]
    context: fresh

  - id: synthesize
    command: meridian-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: FIX REVIEW ISSUES
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-fixes
    command: meridian-implement-review-fixes
    depends_on: [synthesize]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINAL SUMMARY
  # ═══════════════════════════════════════════════════════════════════

  - id: summary
    command: meridian-workflow-summary
    depends_on: [implement-fixes]
    context: fresh
